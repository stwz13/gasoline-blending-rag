# Три сервиса: модель (Ollama), RAG-сервис (FastAPI) и чат (Gradio).
# Запуск: docker compose up -d --build
# Модель скачивается один раз: docker compose exec ollama ollama pull hf.co/yandex/YandexGPT-5-Lite-8B-instruct-GGUF
# Чат: http://localhost:7860, API: http://localhost:8000/docs

services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    # Если есть видеокарта NVIDIA и установлен NVIDIA Container Toolkit, раскомментируйте:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  rag-api:
    build: .
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  chat:
    build: .
    command: python app/chat.py --host 0.0.0.0 --port 7860
    environment:
      RAG_API_URL: http://rag-api:8000
    ports:
      - "7860:7860"
    depends_on:
      - rag-api

volumes:
  ollama:
